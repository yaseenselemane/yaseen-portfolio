  <script>
    // js: scripting is on. motion: animations allowed (?motion forces it, for testing on machines with animations off).
    // Drop motion if the module never boots, so nothing stays hidden.
    (function (d) {
      d.classList.add('js');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]motion/.test(location.search)) d.classList.add('motion');
      setTimeout(function () { if (!window.__route) d.classList.remove('motion'); }, 3000);
    })(document.documentElement);
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
